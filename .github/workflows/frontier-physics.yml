name: Frontier physics check
on:
  push:
    branches: [main]
    paths:
      - 'experiments/12_compactness_cancellation_tax.py'
      - 'experiments/13_impulse_packing_energy_ladder.py'
      - 'experiments/14_smooth_vorticity_packing.py'
      - 'experiments/15_remote_strain_energy_composition.py'
      - 'experiments/16_harmonic_strain_energy_floor.py'
      - 'experiments/17_hodge_strain_microscope.py'
      - 'experiments/18_arb_hodge_certificate.py'
      - 'experiments/19_vorticity_to_strain_transaction.py'
      - 'experiments/20_transaction_gain_cost.py'
      - 'theory/11_impulse_packing_energy_ladder.md'
      - 'theory/12_smooth_packing_viscous_clock.md'
      - 'theory/13_remote_strain_energy_composition.md'
      - 'theory/14_harmonic_vortical_split.md'
      - 'theory/15_hodge_strain_microscope.md'
      - 'theory/16_hodge_transition_radius.md'
      - 'theory/17_vorticity_to_strain_transaction.md'
      - 'theory/10_compactness_cancellation_tax.md'
      - '.github/workflows/frontier-physics.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frontier:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        bits: [160, 256, 512]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned precision stack
        run: python -m pip install mpmath==1.4.1 python-flint==0.9.0
      - name: Run compactness-cancellation tax
        shell: bash
        env:
          ARB_PREC_BITS: ${{ matrix.bits }}
        run: |
          set -euo pipefail
          python experiments/12_compactness_cancellation_tax.py | tee result-12-${{ matrix.bits }}.json
      - name: Run impulse-packing energy ladder
        shell: bash
        env:
          ARB_PREC_BITS: ${{ matrix.bits }}
        run: |
          set -euo pipefail
          python experiments/13_impulse_packing_energy_ladder.py | tee result-13-${{ matrix.bits }}.json
      - name: Run smooth-vorticity packing and viscous-clock test
        shell: bash
        env:
          ARB_PREC_BITS: ${{ matrix.bits }}
        run: |
          set -euo pipefail
          python experiments/14_smooth_vorticity_packing.py | tee result-14-${{ matrix.bits }}.json
      - name: Run remote-strain energy composition test
        shell: bash
        env:
          ARB_PREC_BITS: ${{ matrix.bits }}
        run: |
          set -euo pipefail
          python experiments/15_remote_strain_energy_composition.py | tee result-15-${{ matrix.bits }}.json
      - name: Run harmonic-strain energy-floor test
        shell: bash
        env:
          ARB_PREC_BITS: ${{ matrix.bits }}
        run: |
          set -euo pipefail
          python experiments/16_harmonic_strain_energy_floor.py | tee result-16-${{ matrix.bits }}.json
      - name: Run Hodge strain microscope test
        shell: bash
        env:
          ARB_PREC_BITS: ${{ matrix.bits }}
        run: |
          set -euo pipefail
          python experiments/17_hodge_strain_microscope.py | tee result-17-${{ matrix.bits }}.json
      - name: Run Arb Hodge certificate
        shell: bash
        env:
          ARB_PREC_BITS: ${{ matrix.bits }}
        run: |
          set -euo pipefail
          python experiments/18_arb_hodge_certificate.py | tee result-18-${{ matrix.bits }}.json
      - name: Run vorticity-to-strain transaction microscope
        shell: bash
        env:
          ARB_PREC_BITS: ${{ matrix.bits }}
        run: |
          set -euo pipefail
          python experiments/19_vorticity_to_strain_transaction.py | tee result-19-${{ matrix.bits }}.json
      - name: Run transaction gain-cost attack
        shell: bash
        env:
          ARB_PREC_BITS: ${{ matrix.bits }}
        run: |
          set -euo pipefail
          python experiments/20_transaction_gain_cost.py | tee result-20-${{ matrix.bits }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontier-results-${{ matrix.bits }}bit
          path: |
            result-12-${{ matrix.bits }}.json
            result-13-${{ matrix.bits }}.json
            result-14-${{ matrix.bits }}.json
            result-15-${{ matrix.bits }}.json
            result-16-${{ matrix.bits }}.json
            result-17-${{ matrix.bits }}.json
            result-18-${{ matrix.bits }}.json
            result-19-${{ matrix.bits }}.json
            result-20-${{ matrix.bits }}.json
          if-no-files-found: warn
