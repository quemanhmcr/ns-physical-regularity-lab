name: Arb physics checks

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  precision-sweep:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        bits: [160, 256, 512]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned arbitrary-precision stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install python-flint==0.9.0 mpmath==1.4.1
      - name: Record package versions
        run: |
          python - <<'PY'
          import flint, mpmath, sys
          print(sys.version)
          print('python-flint', getattr(flint, '__version__', 'unknown'))
          print('mpmath', mpmath.__version__)
          PY
      - name: Run scale-cancellation sanity gate remotely
        shell: bash
        env:
          ARB_PREC_BITS: ${{ matrix.bits }}
        run: |
          set -euo pipefail
          python experiments/00_precision_and_scaling.py | tee result-${{ matrix.bits }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arb-result-${{ matrix.bits }}bit
          path: result-${{ matrix.bits }}.json
          if-no-files-found: warn
