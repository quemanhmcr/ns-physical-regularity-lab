name: Arb physics checks

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  precision-sweep:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        bits: [160, 256, 512]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned arbitrary-precision stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install python-flint==0.9.0 mpmath==1.4.1
      - name: Record package versions
        run: |
          python - <<'PY'
          import flint, mpmath, sys
          print(sys.version)
          print('python-flint', getattr(flint, '__version__', 'unknown'))
          print('mpmath', mpmath.__version__)
          PY
      - name: Run scale-cancellation sanity gate remotely
        shell: bash
        env:
          ARB_PREC_BITS: ${{ matrix.bits }}
        run: |
          set -euo pipefail
          python experiments/00_precision_and_scaling.py | tee result-00-${{ matrix.bits }}.json
      - name: Run canonical strained-vortex toll test remotely
        shell: bash
        env:
          ARB_PREC_BITS: ${{ matrix.bits }}
        run: |
          set -euo pipefail
          python experiments/01_burgers_vortex_toll.py | tee result-01-${{ matrix.bits }}.json
      - name: Run material-lineage switching toll test remotely
        shell: bash
        env:
          ARB_PREC_BITS: ${{ matrix.bits }}
        run: |
          set -euo pipefail
          python experiments/02_oseen_lineage_switch.py | tee result-02-${{ matrix.bits }}.json
      - name: Run finite-filament strain-support test remotely
        shell: bash
        env:
          ARB_PREC_BITS: ${{ matrix.bits }}
        run: |
          set -euo pipefail
          python experiments/03_finite_filament_strain.py | tee result-03-${{ matrix.bits }}.json
      - name: Run closed-ring symmetry test remotely
        shell: bash
        env:
          ARB_PREC_BITS: ${{ matrix.bits }}
        run: |
          set -euo pipefail
          python experiments/04_closed_ring_symmetry.py | tee result-04-${{ matrix.bits }}.json
      - name: Run planar-loop geometric gate remotely
        shell: bash
        env:
          ARB_PREC_BITS: ${{ matrix.bits }}
        run: |
          set -euo pipefail
          python experiments/05_planar_loop_gate.py | tee result-05-${{ matrix.bits }}.json
      - name: Run nonplanar stretching onset remotely
        shell: bash
        env:
          ARB_PREC_BITS: ${{ matrix.bits }}
        run: |
          set -euo pipefail
          python experiments/06_nonplanar_stretching.py | tee result-06-${{ matrix.bits }}.json
      - name: Run geometric mode-collapse test remotely
        shell: bash
        env:
          ARB_PREC_BITS: ${{ matrix.bits }}
        run: |
          set -euo pipefail
          python experiments/07_geometric_mode_collapse.py | tee result-07-${{ matrix.bits }}.json
      - name: Run closed-ring far-donor collateral test remotely
        shell: bash
        env:
          ARB_PREC_BITS: ${{ matrix.bits }}
        run: |
          set -euo pipefail
          python experiments/08_closed_ring_far_donor.py | tee result-08-${{ matrix.bits }}.json
      - name: Run exact Beltrami geometry-tax calibration remotely
        shell: bash
        env:
          ARB_PREC_BITS: ${{ matrix.bits }}
        run: |
          set -euo pipefail
          python experiments/09_beltrami_geometry_tax.py | tee result-09-${{ matrix.bits }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arb-results-${{ matrix.bits }}bit
          path: result-*-${{ matrix.bits }}.json
          if-no-files-found: warn
